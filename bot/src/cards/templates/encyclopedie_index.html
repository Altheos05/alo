<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#050810;}
  .hud{--accent:#5ec9d6;--glow:rgba(94,201,214,0.4);--text-strong:#eaf6ff;--text-muted:#8fb4c9;--text-faint:#4d6b7d;font-family:'Rajdhani',Arial,sans-serif;}
  .hud *{box-sizing:border-box;font-family:inherit}
  .hud-bg{background:radial-gradient(circle at 50% 22%, rgba(94,201,214,0.14), transparent 60%), linear-gradient(180deg,#060b14,#050810);}
  .hud-panel{background:rgba(13,27,43,0.9);border:1.5px solid var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 46px var(--glow);position:relative}
  .hud-corner{position:absolute;width:30px;height:30px}
  .hud-dot{width:8px;height:8px;border-radius:50%}
  .menu-row{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.07)}
  .menu-num{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--accent);flex-shrink:0}
  .menu-label{font-weight:600;font-size:24px;color:var(--text-strong);flex-grow:1}
  .menu-sub{font-size:16px;color:var(--text-faint);font-weight:500;margin-left:8px}
  .overflow{text-align:center;font-size:15px;color:var(--text-faint);margin-top:14px}
</style>
</head>
<body>
<div class="hud hud-bg" style="width:1080px;height:1440px;display:flex;align-items:center;justify-content:center;position:relative;">
  <div class="hud-panel" style="width:984px;height:1344px;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;">
    <div class="hud-corner" style="top:-2px;left:-2px;border-top:3px solid var(--accent);border-left:3px solid var(--accent);border-radius:4px 0 0 0;"></div>
    <div class="hud-corner" style="top:-2px;right:-2px;border-top:3px solid var(--accent);border-right:3px solid var(--accent);border-radius:0 4px 0 0;"></div>
    <div class="hud-corner" style="bottom:-2px;left:-2px;border-bottom:3px solid var(--accent);border-left:3px solid var(--accent);border-radius:0 0 0 4px;"></div>
    <div class="hud-corner" style="bottom:-2px;right:-2px;border-bottom:3px solid var(--accent);border-right:3px solid var(--accent);border-radius:0 0 4px 0;"></div>
    <div style="height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(94,201,214,0.25);">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="hud-dot" style="background:var(--accent);box-shadow:0 0 6px var(--accent);"></span>
        <span class="hud-dot" style="background:rgba(255,255,255,0.2);"></span>
        <span class="hud-dot" style="background:rgba(255,255,255,0.2);"></span>
        <span style="margin-left:10px;font-weight:700;font-size:20px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;">Encyclopédie</span>
      </div>
      <div style="font-weight:600;font-size:18px;color:var(--text-faint);">{{entryCount}} pages</div>
    </div>
    <div style="height:1px;background:rgba(94,201,214,0.2);margin:20px 44px 0 44px;"></div>
    <div style="flex-grow:1;padding:20px 44px 0 44px;overflow:hidden;">{{itemsHtml}}</div>
    <div style="height:70px;flex-shrink:0;border-top:1px solid rgba(94,201,214,0.25);display:flex;align-items:center;justify-content:center;">
      <div style="font-weight:600;font-size:13px;letter-spacing:3px;color:var(--text-faint);text-transform:uppercase;">Système Cardinal · ALO</div>
    </div>
  </div>
</div>
</body>
</html>
