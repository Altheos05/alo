<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;background:#050810;}
  .hud{--accent:#7fd1e8;--glow:rgba(127,209,232,0.45);--text-strong:#eaf6ff;--text-muted:#8fb4c9;--text-faint:#4d6b7d;font-family:'Rajdhani',Arial,sans-serif;}
  .hud *{box-sizing:border-box;font-family:inherit}
  .hud-bg{background:radial-gradient(circle at 50% 22%, rgba(127,209,232,0.16), transparent 60%), linear-gradient(180deg,#060b14,#050810);}
  .hud-panel{background:rgba(13,27,43,0.9);border:1.5px solid var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 46px var(--glow);position:relative}
  .hud-corner{position:absolute;width:30px;height:30px}
  .hud-dot{width:8px;height:8px;border-radius:50%}
  .hud-label{font-weight:600;font-size:18px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint)}
  .fact-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
  .fact-lbl{font-size:19px;color:var(--text-muted)}
  .fact-val{font-size:19px;font-weight:700;color:var(--text-strong)}
  .bar-track{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:3px;overflow:hidden;height:18px;position:relative}
  .bar-fill{height:100%;background:linear-gradient(90deg,#1f6a8a,#7fd1e8)}
  .tag{display:inline-block;padding:5px 12px;border-radius:20px;background:rgba(127,209,232,0.12);color:var(--text-muted);font-size:14px;font-weight:600;margin:3px 6px 3px 0}
</style>
</head>
<body>
<div class="hud hud-bg" style="width:1080px;height:1440px;display:flex;align-items:center;justify-content:center;position:relative;">
  <div class="hud-panel" style="width:984px;height:1344px;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;">
    <div class="hud-corner" style="top:-2px;left:-2px;border-top:3px solid var(--accent);border-left:3px solid var(--accent);border-radius:4px 0 0 0;"></div>
    <div class="hud-corner" style="top:-2px;right:-2px;border-top:3px solid var(--accent);border-right:3px solid var(--accent);border-radius:0 4px 0 0;"></div>
    <div class="hud-corner" style="bottom:-2px;left:-2px;border-bottom:3px solid var(--accent);border-left:3px solid var(--accent);border-radius:0 0 0 4px;"></div>
    <div class="hud-corner" style="bottom:-2px;right:-2px;border-bottom:3px solid var(--accent);border-right:3px solid var(--accent);border-radius:0 0 4px 0;"></div>
    <div style="height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(127,209,232,0.25);">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="hud-dot" style="background:var(--accent);box-shadow:0 0 6px var(--accent);"></span>
        <span class="hud-dot" style="background:rgba(255,255,255,0.2);"></span>
        <span class="hud-dot" style="background:rgba(255,255,255,0.2);"></span>
        <span style="margin-left:10px;font-weight:700;font-size:20px;letter-spacing:2px;color:var(--text-faint);text-transform:uppercase;">Dialogue <span style="color:var(--accent);">› Relation</span></span>
      </div>
      <div style="font-weight:600;font-size:18px;color:var(--text-faint);">!relation</div>
    </div>
    <div style="padding:26px 44px 4px 44px;flex-shrink:0;">
      <div style="font-weight:700;font-size:30px;color:var(--text-strong);">{{npcName}}</div>
    </div>
    <div style="padding:14px 44px 0 44px;flex-shrink:0;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
        <span class="hud-label">Affinité — {{relationLabel}}</span>
        <span style="font-size:16px;color:var(--text-faint);">{{affinity}} / 100</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:{{affinityPercent}}%;"></div></div>
    </div>
    <div style="height:1px;background:rgba(127,209,232,0.2);margin:18px 44px 0 44px;"></div>
    <div style="padding:14px 44px 0 44px;flex-grow:1;">
      <div class="fact-row"><span class="fact-lbl">Échanges</span><span class="fact-val">{{interactionCount}}</span></div>
      <div class="fact-row"><span class="fact-lbl">Première rencontre</span><span class="fact-val">{{firstMet}}</span></div>
      <div class="fact-row"><span class="fact-lbl">Cadeaux offerts</span><span class="fact-val">{{giftsGiven}}</span></div>
      <div class="fact-row" style="border-bottom:none;"><span class="fact-lbl">Quêtes rendues</span><span class="fact-val">{{questsDone}}</span></div>
      <div class="hud-label" style="margin:18px 0 8px 0;">Sujets déjà abordés</div>
      <div>{{topicsHtml}}</div>
    </div>
    <div style="height:70px;flex-shrink:0;border-top:1px solid rgba(127,209,232,0.25);display:flex;align-items:center;justify-content:center;">
      <div style="font-weight:600;font-size:13px;letter-spacing:3px;color:var(--text-faint);text-transform:uppercase;">Système Cardinal · ALO</div>
    </div>
  </div>
</div>
</body>
</html>
